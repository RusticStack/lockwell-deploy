# Lockwell — production configuration.
#
# This is the same config baked into the published Docker image. docker-compose.yml
# mounts this copy over the baked default so you can tune it WITHOUT pulling a new
# image: edit a value, then recreate the container (`docker compose up -d`). When
# running without Docker, pass it with `lockwelld -c lockwell.production.toml`.
#
# A few values are also overridable by environment variable
# (LOCKWELL_MASTER_KEY_FILE, etc.).

[server]
listen_addr = "0.0.0.0:9000"   # S3 API + GET /health + GET /readyz (public, via proxy)
web_addr    = "0.0.0.0:9001"   # admin web UI + Prometheus /metrics + health (KEEP PRIVATE)
# The admin listener (web_addr) serves both the login-gated admin UI and the
# UNAUTHENTICATED Prometheus /metrics endpoint. Do NOT expose port 9001 to the
# public internet — bind it to a private network, reach it over a VPN/SSH tunnel,
# or proxy it behind extra auth. Only the S3 port (9000) is meant to be public.
# (A third `admin_addr` slot exists, reserved for a future JSON admin REST API;
# today it would just duplicate web_addr, so we leave it unset.)
#
# Lockwell expects TLS to be terminated by your reverse proxy (Coolify/Dokploy,
# Caddy, nginx, Traefik). This opt-in allows the plaintext container-internal
# bind; the proxy serves HTTPS to the public. Do NOT expose these ports directly
# to the internet without a TLS terminator in front.
allow_insecure_public = true

[metadata]
# Lockwell runs entirely on the embedded BadgerDB engine ("kvmeta"), stored at
# <storage.data_dir>/metadata. There is no external database: no DSN, no
# connection pool, no read replica. The legacy driver/dsn/pool knobs are accepted
# for config-validation back-compat but are IGNORED.
driver = "kvmeta"
# STRICT durability is the default: every metadata commit fsyncs the WAL before
# returning, so an acked write survives power loss — the safe choice for a
# single node with no replica. For higher write throughput at the cost of losing
# at most ~10 ms of acked writes on power loss (matches Garage's data_fsync=off
# model), uncomment sync_interval_ms below AND storage.relaxed_durability.
# sync_interval_ms = 10
# Decompressed-SST block cache (MiB): keeps hot version/chunk metadata resident
# so small-object GETs stay fast under concurrent writes. ~64-128 MiB is a good
# default; raise on read-heavy, large-dataset nodes.
block_cache_mb = 64
# Single-node read caches: bucket/config + access-key lookups served from memory,
# invalidated in-process on every mutation; this TTL only bounds staleness from
# an out-of-process CLI edit. Single-node only.
read_cache_ttl = "5s"
# Coalesce best-effort last-used/last-access timestamp writes so a hot key/object
# is written at most once per window instead of once per read (removes two writes
# from every GET/HEAD). Audit still records every request exactly.
access_touch_coalesce_window = "60s"
# Batched async audit for SUCCESS reads (mutations/denials stay synchronous and
# fail-closed); every read is still audited, with loss only on a hard crash
# within this window.
audit_read_async_window = "250ms"

[storage]
driver = "filesystem"
data_dir = "/var/lib/lockwell/blobs"
temp_dir = "/var/lib/lockwell/tmp"
# Keep per-blob fsync ON (strict) by default — pairs with the strict metadata
# tier above. Set true ONLY together with metadata.sync_interval_ms for the
# grouped/throughput tier.
# relaxed_durability = true

[encryption]
# Always-on at-rest encryption (object data + Badger metadata). The master key is
# auto-generated on first boot under the data volume; for stronger separation,
# mount it from a secret and set LOCKWELL_MASTER_KEY_FILE. Losing the master key
# makes the data unrecoverable — back it up.
enabled = true
algorithm = "xchacha20-poly1305"
key_provider = "local"

[security]
private_by_default = true     # buckets/objects are private unless explicitly shared
allow_public_buckets = false
max_presign_ttl = "15m"
# Per-source-IP request cap, applied BEFORE SigV4 verification (cheap anti-abuse).
# NOTE: behind a reverse proxy every request may share the proxy's IP, making this
# effectively a global cap — size it for your whole node, not one client. This
# generous default (≈10k req/s) bounds abuse without throttling normal use; set 0
# to disable. For a true per-tenant cap (applied AFTER auth), set
# rate_limit_per_tenant_per_minute instead/as well.
rate_limit_per_minute = 600000
# rate_limit_per_tenant_per_minute = 0   # 0 = disabled; per-authenticated-tenant cap

[dedup]
enabled = true
scope = "tenant"
hash = "blake3"
chunk_size = "8MiB"

[compression]
enabled = true
algorithm = "zstd"
level = 3

[scrub]
# Background integrity scrub (decrypt + verify plaintext hashes). Strongly
# recommended in production so silent disk corruption is detected, not served.
enabled = true

[audit]
enabled = true
# Audit events are stored in the embedded metadata engine — there is no external
# audit database. "metadata" is the only implemented sink.
sink = "metadata"
# Optional retention backstops (0 = keep forever, append-only):
# retention_days = 0
# max_rows = 0

[web]
enabled = true
assets = "embedded"
csrf = true
# Set true if the admin UI is served over HTTPS end-to-end. Behind a TLS-
# terminating proxy that forwards plain HTTP internally, leave false.
secure_cookie = false

[notifications]
# Bucket-notification webhooks are refused at dial time when the target resolves
# to a link-local / cloud-metadata address (169.254.169.254, fe80::/10,
# fd00:ec2::/32) — otherwise a notification config could turn the daemon into a
# credential-theft SSRF against the instance-metadata endpoint. RFC1918 private
# ranges and loopback are always allowed (legitimate internal webhooks). Set true
# ONLY if you genuinely must deliver to a link-local target.
allow_link_local_webhooks = false
