# nginx reverse proxy for Lockwell's public S3 port.
#
# Terminate TLS here (certbot / your own certs) and forward plain HTTP to the
# container on 127.0.0.1:9000. The three object-storage-critical settings are
# the large body limit, disabled request buffering (stream uploads instead of
# spooling them to disk), and forwarding Host / X-Forwarded-Proto so SigV4 and
# signed URLs see the original host.

server {
    listen 443 ssl;
    server_name s3.example.com;

    ssl_certificate     /etc/letsencrypt/live/s3.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/s3.example.com/privkey.pem;

    # Allow large object uploads (size to your biggest single PUT / multipart part).
    client_max_body_size 5G;

    location / {
        proxy_pass http://127.0.0.1:9000;

        # Stream the body through rather than buffering multi-GiB uploads to disk.
        proxy_request_buffering off;
        proxy_http_version 1.1;

        # SigV4 and signed URLs are computed over the original host + scheme.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }
}

# Do NOT proxy port 9001 (admin UI + UNAUTHENTICATED /metrics) to the internet.
# Keep it on localhost and reach it over an SSH tunnel.
